services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 2s
      timeout: 2s
      retries: 15

  migrate:
    image: paddock-catalogue:dev
    build:
      context: .
      args: { SERVICE: catalogue }
    command: ["alembic", "-c", "services/catalogue/alembic.ini", "upgrade", "head"]
    environment: &catalogue_env
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy

  catalogue:
    image: paddock-catalogue:dev
    environment: *catalogue_env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  analysis:
    image: paddock-analysis:dev
    build:
      context: .
      args: { SERVICE: analysis }
    environment:
      CATALOGUE_URL: http://catalogue:8000
    ports:
      - "8001:8000"
    depends_on:
      - catalogue

  web:
    image: paddock-web:dev
    build:
      context: .
      args: { SERVICE: web }
    environment:
      CATALOGUE_URL: http://catalogue:8000
      ANALYSIS_URL: http://analysis:8000
    ports:
      - "8080:8000"
    depends_on:
      - catalogue
      - analysis

volumes:
  postgres-data:
