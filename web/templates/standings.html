{% for row in standings.rows %}
<tr{% if row.out %} class="out"{% endif %}>
  <td class="rank">{{ row.rank }}</td>
  <td><span class="swatch" style="background: {% if row.dashed %}linear-gradient(90deg, {{ row.color }} 0 33%, #000 33% 67%, {{ row.color }} 67%){% else %}{{ row.color }}{% endif %}"></span> <b>{{ row.code }}</b></td>
  <td>{{ row.team }}</td>
  <td>{{ row.cell }}</td>
  <td>{% if row.in_pit %}<span class="pit">In Pit</span>{% endif %}{% if row.fastest %}<span class="fastest" title="fastest lap">&#9201;</span>{% endif %}</td>
  <td>{% if row.delta > 0 %}<span class="gain">+{{ row.delta }}</span>{% elif row.delta < 0 %}<span class="loss">{{ row.delta }}</span>{% else %}<span class="same">&ndash;</span>{% endif %}</td>
</tr>
{% endfor %}
