apiVersion: v1
kind: Service
metadata:
  name: catalogue
  namespace: paddock
spec:
  selector:
    app: catalogue
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: paddock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogue
  template:
    metadata:
      labels:
        app: catalogue
    spec:
      initContainers:
        - name: migrate
          image: cypriankrenski93/paddock-catalogue:0.2.0
          command: ["alembic", "-c", "services/catalogue/alembic.ini", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: paddock-config
            - secretRef:
                name: paddock-secret
      containers:
        - name: catalogue
          image: cypriankrenski93/paddock-catalogue:0.2.0
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: paddock-config
            - secretRef:
                name: paddock-secret
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 256Mi
