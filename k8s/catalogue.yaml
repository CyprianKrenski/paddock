apiVersion: v1
kind: Service
metadata:
  name: catalogue
  namespace: paddock
spec:
  selector:
    app: catalogue
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: paddock
spec:
  selector:
    matchLabels:
      app: catalogue
  template:
    metadata:
      labels:
        app: catalogue
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: migrate
          image: cypriankrenski93/paddock-catalogue:0.3.2
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: paddock-config
            - secretRef:
                name: paddock-secret
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 256Mi
      containers:
        - name: catalogue
          image: cypriankrenski93/paddock-catalogue:0.3.2
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: paddock-config
            - secretRef:
                name: paddock-secret
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "1"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 256Mi
