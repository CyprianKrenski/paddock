apiVersion: v1
kind: Service
metadata:
  name: analysis
  namespace: paddock
spec:
  selector:
    app: analysis
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analysis
  namespace: paddock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analysis
  template:
    metadata:
      labels:
        app: analysis
    spec:
      containers:
        - name: analysis
          image: cypriankrenski93/paddock-analysis:0.2.0
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: paddock-config
          readinessProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 256Mi
