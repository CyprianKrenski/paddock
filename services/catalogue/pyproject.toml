[project]
name = "catalogue"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.143.0",
    "httpx2>=2.13.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
